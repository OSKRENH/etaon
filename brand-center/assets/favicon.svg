<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Эталон">
  <!-- Светлая подложка нужна, чтобы знак не терялся на тёмных вкладках браузера:
       синий знак на прозрачном фоне сливается с тёмной темой, а подложка работает
       одинаково везде и не зависит от того, как браузер определяет цветовую схему.
       Знак вписан плотно: в исходном symbol-etalon.svg он занимает лишь 40 % ширины. -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <path fill="#223e90" transform="translate(32 32) scale(0.3975) translate(-150 -133.335)" d="M89.62,163.94v19.4h81.98l7.53-19.4h-89.51ZM122.29,123.6v19.4h64.86l7.53-19.4h-72.39ZM89.62,83.33v19.4h113.23l7.53-19.4h-120.77Z"/>
</svg>
