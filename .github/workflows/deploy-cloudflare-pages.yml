name: Deploy Etalon Worker

on:
  push:
    branches: [main]
    paths:
      - "brand-center/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-etaon-worker
  cancel-in-progress: true

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SITE_URL: https://etaon.ivankamaldinov.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Check Gilroy web fonts
        run: |
          test -s brand-center/fonts/Gilroy-Regular.ttf
          test -s brand-center/fonts/Gilroy-Medium.ttf

      - name: Install conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zip inkscape python3-pip
          python3 -m pip install --quiet --break-system-packages weasyprint

      - name: Prepare downloadable assets
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x brand-center/scripts/*.sh
          brand-center/scripts/prepare-downloadable-assets.sh 2>&1 | tee /tmp/prepare.log

      - name: Render PDF preview
        if: steps.prepare.outcome == 'success'
        shell: bash
        run: |
          mkdir -p /tmp/brand-guide-preview
          pdftoppm -png -r 110 \
            brand-center/downloads/Etalon_Brand_Guide_2025.pdf \
            /tmp/brand-guide-preview/page
          cp brand-center/downloads/Etalon_Brand_Guide_2025.pdf /tmp/brand-guide-preview/
          test "$(find /tmp/brand-guide-preview -name 'page-*.png' | wc -l)" -eq 6

      - name: Upload PDF preview artifact
        if: steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: etalon-brand-guide-preview
          path: /tmp/brand-guide-preview
          retention-days: 7
          if-no-files-found: error

      - name: Audit code and local links
        if: steps.prepare.outcome == 'success'
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 brand-center/scripts/audit-site.py
            node --check brand-center/app.js
            node --check brand-center/language-switch-fix.js
            node --check brand-center/mobile-nav.js
            PYTHONPYCACHEPREFIX=/tmp/etaon-pycache python3 -m compileall -q brand-center/scripts
            for script in brand-center/scripts/*.sh; do bash -n "$script"; done
          } 2>&1 | tee /tmp/audit.log

      - name: Remove build-only files from public assets
        if: steps.prepare.outcome == 'success' && steps.audit.outcome == 'success'
        run: |
          rm -rf brand-center/scripts
          test ! -e brand-center/scripts

      - name: Install Wrangler
        if: steps.prepare.outcome == 'success' && steps.audit.outcome == 'success'
        run: npm install --global wrangler@latest

      - name: Replace existing etaon Worker
        if: steps.prepare.outcome == 'success' && steps.audit.outcome == 'success'
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler.log

      - name: Verify published site and downloads
        if: steps.deploy.outcome == 'success'
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x .github/scripts/verify-live.sh
          .github/scripts/verify-live.sh 2>&1 | tee /tmp/verify.log

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          PREPARE_LOG=$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/prepare.log 2>/dev/null || true)
          AUDIT_LOG=$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/audit.log 2>/dev/null || true)
          DEPLOY_LOG=$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/wrangler.log 2>/dev/null || true)
          VERIFY_LOG=$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/verify.log 2>/dev/null || true)
          URL=$(printf '%s\n' "$DEPLOY_LOG" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1 || true)
          URL=${URL:-$SITE_URL}

          if [ "$PREPARE_OUTCOME" != "success" ]; then
            STATUS="$PREPARE_OUTCOME"
          elif [ "$AUDIT_OUTCOME" != "success" ]; then
            STATUS="$AUDIT_OUTCOME"
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            STATUS="$DEPLOY_OUTCOME"
          else
            STATUS="$VERIFY_OUTCOME"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          {
            printf 'status=%s\n' "$STATUS"
            printf 'prepare=%s\n' "$PREPARE_OUTCOME"
            printf 'audit=%s\n' "$AUDIT_OUTCOME"
            printf 'deploy=%s\n' "$DEPLOY_OUTCOME"
            printf 'verify=%s\n' "$VERIFY_OUTCOME"
            printf 'url=%s\n' "$URL"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run=%s\n' "$GITHUB_RUN_ID"
            printf '%s\n' '--- prepare output ---'
            printf '%s\n' "$PREPARE_LOG" | tail -45
            printf '%s\n' '--- audit output ---'
            printf '%s\n' "$AUDIT_LOG" | tail -45
            printf '%s\n' '--- wrangler output ---'
            printf '%s\n' "$DEPLOY_LOG" | tail -45
            printf '%s\n' '--- live verification output ---'
            printf '%s\n' "$VERIFY_LOG" | tail -45
          } > .cloudflare-worker-status
          git add .cloudflare-worker-status
          git commit -m "Record etaon Worker deployment [skip ci]"
          git push origin main

      - name: Fail if any quality gate failed
        if: steps.prepare.outcome != 'success' || steps.audit.outcome != 'success' || steps.deploy.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
