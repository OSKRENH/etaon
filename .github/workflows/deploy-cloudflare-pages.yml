name: Deploy Etalon Worker

on:
  push:
    branches: [main]
    paths:
      - "brand-center/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-etaon-worker
  cancel-in-progress: true

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Replace existing etaon Worker
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/wrangler.log

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          CLEAN_LOG=$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/wrangler.log 2>/dev/null || true)
          URL=$(printf '%s\n' "$CLEAN_LOG" | grep -Eo 'https://[^[:space:]]+' | tail -1 || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          {
            printf 'status=%s\n' "$DEPLOY_OUTCOME"
            printf 'url=%s\n' "$URL"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run=%s\n' "$GITHUB_RUN_ID"
            printf '%s\n' '--- wrangler output ---'
            printf '%s\n' "$CLEAN_LOG" | tail -60
          } > .cloudflare-worker-status
          git add .cloudflare-worker-status
          git commit -m "Record etaon Worker deployment [skip ci]"
          git push origin main

      - name: Fail if Worker deployment failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
