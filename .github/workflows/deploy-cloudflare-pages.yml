name: Deploy Etalon Brand Center

on:
  push:
    branches: [main]
    paths:
      - "brand-center/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT_NAME: etaon

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Ensure Pages project exists
        run: wrangler pages project create "$PROJECT_NAME" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: >-
          wrangler pages deploy brand-center
          --project-name="$PROJECT_NAME"
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-message="${{ github.event.head_commit.message || 'Manual deployment' }}"
