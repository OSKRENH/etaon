name: Deploy AURIX bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aurix-bridge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aurix-bridge
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AURIX repository
        uses: actions/checkout@v4
        with:
          repository: OSKRENH/aurix
          ref: main
          path: aurix

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install logo conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape poppler-utils zip

      - name: Prepare AURIX static assets and downloads
        working-directory: aurix
        run: |
          chmod +x scripts/build-logo-archives.sh
          scripts/build-logo-archives.sh .

          rm -rf dist-site
          mkdir -p dist-site/assets/logos dist-site/fonts/guild dist-site/fonts/tt-hoves-pro dist-site/downloads
          cp index.html brandbook.html app.js fonts.css styles.css mobile-fix.css dist-site/
          cp assets/logos/*.svg dist-site/assets/logos/

          cp fonts/guild/GuildA-Display-Regular-Desktop.otf dist-site/fonts/guild/
          cp "fonts/tt-hoves-pro/TT Hoves Pro Trial Regular.ttf" dist-site/fonts/tt-hoves-pro/

          zip -jq dist-site/downloads/AURIX_Fonts.zip \
            fonts/guild/GuildA-Display-Regular-Desktop.otf \
            "fonts/tt-hoves-pro/TT Hoves Pro Trial Regular.ttf"

          cp downloads/*.zip dist-site/downloads/

          test -s dist-site/index.html
          test -s dist-site/fonts/guild/GuildA-Display-Regular-Desktop.otf
          test -s "dist-site/fonts/tt-hoves-pro/TT Hoves Pro Trial Regular.ttf"
          test -s dist-site/downloads/AURIX_Fonts.zip
          test -s dist-site/downloads/AURIX_Logos_All_Formats.zip
          test -s dist-site/downloads/AURIX_Logos.zip
          test -s dist-site/downloads/AURIX_With_Descriptor_Deep_Purple.zip
          test -s dist-site/downloads/AURIX_With_Descriptor_White.zip
          test -s dist-site/downloads/AURIX_Wordmark_Deep_Purple.zip
          test -s dist-site/downloads/AURIX_Wordmark_White.zip
          test -s dist-site/downloads/AURIX_Symbol_Deep_Purple.zip
          test -s dist-site/downloads/AURIX_Symbol_White.zip
          test -s worker.js
          test -s wrangler.jsonc

      - name: Validate JavaScript
        working-directory: aurix
        run: |
          node --check app.js
          node --check worker.js

      - name: Deploy AURIX to Cloudflare Workers
        working-directory: aurix
        run: npx --yes wrangler@4.121.0 deploy --config wrangler.jsonc

# manual deploy trigger: tested mobile hero width 140vw height 120 percent right -38vw
