name: Deploy AURIX bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aurix-bridge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aurix-bridge
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout AURIX repository
        uses: actions/checkout@v4
        with:
          repository: OSKRENH/aurix
          ref: main
          path: aurix

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        working-directory: aurix
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build AURIX production site
        working-directory: aurix
        run: npm run build

      - name: Validate production build
        working-directory: aurix
        run: |
          node --check app.js
          node --check worker.js
          test -s dist-site/index.html
          test -s dist-site/maps.css
          test -s dist-site/maps.js
          test -d dist-site/assets/maps
          test -d dist-site/downloads/maps
          test -s dist-site/downloads/maps/AURIX_Map_Moscow_Light.jpg
          test -s dist-site/downloads/maps/AURIX_Map_Moscow_Light.svg
          test -s dist-site/downloads/maps/AURIX_Map_Moscow_Light.pdf
          test -s dist-site/downloads/maps/AURIX_Map_Moscow_Dark.jpg
          test -s dist-site/downloads/maps/AURIX_Map_Saint_Petersburg_Light.jpg
          test -s dist-site/downloads/maps/AURIX_Map_Saint_Petersburg_Dark.jpg

      - name: Deploy AURIX to Cloudflare Workers
        working-directory: aurix
        run: npx --yes wrangler@4.121.0 deploy --config wrangler.jsonc

# manual deploy trigger: deploy current AURIX main with repaired packed maps
