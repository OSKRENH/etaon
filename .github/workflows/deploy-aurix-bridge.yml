name: Deploy AURIX bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aurix-bridge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aurix-bridge
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AURIX repository
        uses: actions/checkout@v4
        with:
          repository: OSKRENH/aurix
          ref: main
          path: aurix

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prepare AURIX static assets
        working-directory: aurix
        run: |
          rm -rf dist-site
          mkdir -p dist-site
          cp index.html brandbook.html app.js font-loader.js fonts.css styles.css dist-site/
          cp -R assets downloads fonts dist-site/
          test -s dist-site/index.html
          test -s dist-site/font-loader.js
          test -s dist-site/fonts/guild/part-00.b64
          test -s dist-site/fonts/hoves/part-00.b64
          test -s worker.js
          test -s wrangler.jsonc

      - name: Validate JavaScript
        working-directory: aurix
        run: |
          node --check app.js
          node --check font-loader.js
          node --check worker.js

      - name: Deploy AURIX to Cloudflare Workers
        working-directory: aurix
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
