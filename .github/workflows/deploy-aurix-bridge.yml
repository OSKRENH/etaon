name: Deploy AURIX bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aurix-bridge.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aurix-bridge
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AURIX repository
        uses: actions/checkout@v4
        with:
          repository: OSKRENH/aurix
          ref: main
          path: aurix

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prepare AURIX static assets and downloads
        working-directory: aurix
        run: |
          rm -rf dist-site
          mkdir -p dist-site/assets/logos dist-site/fonts/guild dist-site/fonts/tt-hoves-pro dist-site/downloads
          cp index.html brandbook.html app.js fonts.css styles.css dist-site/
          cp assets/logos/*.svg dist-site/assets/logos/

          cp fonts/guild/GuildA-Display-Regular-Web.woff2 dist-site/fonts/guild/
          cp fonts/guild/GuildA-Display-Italic-Web.woff2 dist-site/fonts/guild/
          cp fonts/guild/GuildA-Display-Bold-Web.woff2 dist-site/fonts/guild/
          cp "fonts/tt-hoves-pro/TT Hoves Pro Trial Regular.ttf" dist-site/fonts/tt-hoves-pro/
          cp "fonts/tt-hoves-pro/TT Hoves Pro Trial Medium.ttf" dist-site/fonts/tt-hoves-pro/

          zip -jq dist-site/downloads/AURIX_Fonts.zip \
            fonts/guild/* \
            fonts/tt-hoves-pro/*.ttf

          zip -jq dist-site/downloads/AURIX_Logos.zip \
            assets/logos/aurix-discover-stars.svg \
            assets/logos/aurix-discover-stars-white.svg \
            assets/logos/wordmark-purple.svg \
            assets/logos/wordmark-white.svg \
            assets/logos/symbol-purple.svg \
            assets/logos/symbol-white.svg

          test -s dist-site/index.html
          test -s dist-site/fonts/guild/GuildA-Display-Regular-Web.woff2
          test -s "dist-site/fonts/tt-hoves-pro/TT Hoves Pro Trial Regular.ttf"
          test -s dist-site/downloads/AURIX_Fonts.zip
          test -s dist-site/downloads/AURIX_Logos.zip
          test -s worker.js
          test -s wrangler.jsonc

      - name: Validate JavaScript
        working-directory: aurix
        run: |
          node --check app.js
          node --check worker.js

      - name: Deploy AURIX to Cloudflare Workers
        working-directory: aurix
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
